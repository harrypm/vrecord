name: Build and Release

# Two releases per version, from one tag: push v<major>.<minor>.<patch>
# (e.g. v1.0.0) and this builds + tests Linux, Windows and macOS once (the
# reusable workflows build-and-test.yml uses), then creates
#   qt6-v1.0.0   Vrecord for Windows with the Qt6 GUI
#                  vrecord-qt6_<version>_windows_x86_64_setup.exe
#                  vrecord-qt6_<version>_windows_x86_64_portable.zip
#                  + screenshots of the Qt6 tabs
#   gtk-v1.0.0   Vrecord with the GTK interface
#                  vrecord-gtk_<version>_windows_x86_64_portable.zip
#                  vrecord-gtk_<version>_linux_amd64.deb / _linux_x86_64.AppImage
#                  vrecord-gtk_<version>_macos_<arch>.dmg / .app.zip
# each with its own SHA256SUMS.txt, both on the tagged commit.
#
# Release kinds:
#   v1.0.0         both created as DRAFTS (publish by hand; the Windows
#                  updater only offers published, non-pre Qt6 releases)
#   v1.0.0-rc1     anything with a '-suffix' makes PRE-RELEASES, published
#                  straight away for testing (never offered by the updater)
#
# The version before any '-suffix' must match VERSION in the vrecord script
# (the updater compares the release tag with the VERSION it was built with).
# Notes: Release/release-notes/qt6-v<version>.md and gtk-v<version>.md
# (see Release/ci/render-release-notes.sh); without one, generated notes.
#
# Trigger: push a v* tag, or run manually with create_release + tag_name
# (a missing tag is created on the commit the run was started from; tick
# prerelease to force pre-releases). A manual run without create_release
# only builds and tests.

permissions:
  contents: write
  actions: write

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create a GitHub release and upload the built binaries"
        required: false
        default: false
        type: boolean
      tag_name:
        description: "Tag to release (e.g. v1.0.0 or v1.0.0-rc1); created if missing"
        required: false
        type: string
      prerelease:
        description: "Mark as a pre-release (automatic for tags with a -suffix)"
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}-${{ github.event.inputs.tag_name }}
  cancel-in-progress: false

jobs:
  resolve-tag:
    name: Resolve release tag
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      checkout_ref: ${{ steps.resolve.outputs.checkout_ref }}
      publish_release: ${{ steps.resolve.outputs.publish_release }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      release_sha: ${{ steps.resolve.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve, create (manual runs) and validate the tag
        id: resolve
        shell: bash
        env:
          INPUT_CREATE: ${{ github.event.inputs.create_release }}
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
          INPUT_PRE: ${{ github.event.inputs.prerelease }}
        run: |
          set -euo pipefail
          PUBLISH="true"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "$INPUT_CREATE" = "true" ]; then
              RAW="$INPUT_TAG"
              [ -n "$RAW" ] || { echo "::error::tag_name is required with create_release"; exit 1; }
            else
              PUBLISH="false"; RAW=""
            fi
          else
            RAW="${{ github.ref_name }}"
          fi
          if [ "$PUBLISH" != "true" ]; then
            { echo "release_tag="; echo "checkout_ref=${{ github.ref }}"
              echo "publish_release=false"; echo "prerelease=false"; echo "release_sha="; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          RAW="${RAW#refs/tags/}"
          [[ "$RAW" == v* ]] || RAW="v${RAW}"
          if [[ ! "$RAW" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Invalid tag '$RAW' (expected v<major>.<minor>.<patch>[-suffix], e.g. v1.0.0 or v1.0.0-rc1)"; exit 1
          fi
          PRE="false"
          if [[ "$RAW" == *-* ]] || [ "$INPUT_PRE" = "true" ]; then PRE="true"; fi

          # manual run: create the tag on this commit if it does not exist yet
          # (a tag pushed with GITHUB_TOKEN does not start another run)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && \
             ! git ls-remote --exit-code --tags origin "refs/tags/${RAW}" > /dev/null 2>&1; then
            git tag "$RAW" "${{ github.sha }}"
            git push origin "refs/tags/${RAW}"
            echo "created tag ${RAW} on ${{ github.sha }}"
          fi
          # the tag must exist on this repository (retry: a just-pushed tag can lag)
          for attempt in $(seq 1 12); do
            if git ls-remote --exit-code --tags origin "refs/tags/${RAW}" > /dev/null 2>&1; then break; fi
            [ "$attempt" = 12 ] && { echo "::error::tag ${RAW} not found on ${{ github.repository }}"; exit 1; }
            echo "tag ${RAW} not visible yet (${attempt}/12); waiting 5 s"; sleep 5
          done

          # the numbers before any -suffix must match VERSION at that tag
          git fetch -q origin "refs/tags/${RAW}:refs/tags/${RAW}" 2>/dev/null || true
          VERSION="$(git show "refs/tags/${RAW}:vrecord" | sed -nE 's/^VERSION="([0-9.-]+)"/\1/p')"
          BASE="${RAW%%-*}"
          digits() { echo "$1" | grep -oE '[0-9]+' | sed -E 's/^0+([0-9])/\1/' | tr '\n' '.' ; }
          if [ "$(digits "$VERSION")" != "$(digits "$BASE")" ]; then
            echo "::error::tag ${RAW} does not match VERSION=\"${VERSION}\" in vrecord - bump VERSION (or tag v${VERSION})"
            exit 1
          fi
          echo "tag ${RAW} matches VERSION ${VERSION} (prerelease=${PRE})"
          SHA="$(git rev-parse "refs/tags/${RAW}^{commit}")"
          { echo "release_tag=${RAW}"; echo "checkout_ref=refs/tags/${RAW}"
            echo "publish_release=true"; echo "prerelease=${PRE}"
            echo "release_sha=${SHA}"; } >> "$GITHUB_OUTPUT"

  build-linux:
    name: Build Linux
    needs: resolve-tag
    uses: ./.github/workflows/build-linux.yml
    with:
      checkout_ref: ${{ needs.resolve-tag.outputs.checkout_ref }}
    secrets: inherit

  build-windows:
    name: Build Windows
    needs: resolve-tag
    uses: ./.github/workflows/build-windows.yml
    with:
      checkout_ref: ${{ needs.resolve-tag.outputs.checkout_ref }}
    secrets: inherit

  build-macos:
    name: Build macOS
    needs: resolve-tag
    uses: ./.github/workflows/build-macos.yml
    with:
      checkout_ref: ${{ needs.resolve-tag.outputs.checkout_ref }}
    secrets: inherit

  upload-release-assets:
    name: Create the Qt6 and GTK releases
    needs: [resolve-tag, build-linux, build-windows, build-macos]
    if: ${{ needs.resolve-tag.outputs.publish_release == 'true' }}
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ needs.resolve-tag.outputs.release_tag }}
      RELEASE_SHA: ${{ needs.resolve-tag.outputs.release_sha }}
      PRERELEASE: ${{ needs.resolve-tag.outputs.prerelease }}
      REPO: ${{ github.repository }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      # the release notes (Release/release-notes/<release tag>.md) and their renderer
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-tag.outputs.checkout_ref }}
          path: src

      - name: Download every build artifact
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Sort the files into the two releases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-qt6 release-gtk
          need() {   # need <release dir> <label> <file name glob>
            local found
            found="$(find dist -type f -name "$3" | head -n 1)"
            [ -n "$found" ] || { echo "::error::missing $2 ($3)"; exit 1; }
            cp "$found" "$1/"
          }
          # Qt6: the Windows Qt6 GUI
          need release-qt6 "Qt6 installer"         'vrecord-qt6_*_windows_x86_64_setup.exe'
          need release-qt6 "Qt6 portable zip"      'vrecord-qt6_*_windows_x86_64_portable.zip'
          # GTK: the GTK interface on every platform
          need release-gtk "GTK Windows portable"  'vrecord-gtk_*_windows_x86_64_portable.zip'
          need release-gtk "GTK .deb"              'vrecord-gtk_*_linux_amd64.deb'
          need release-gtk "GTK AppImage"          'vrecord-gtk_*_linux_x86_64.AppImage'
          for arch in x86_64 arm64 universal; do
            found=0
            for f in $(find "dist/vrecord-gtk-macos-${arch}" -type f \( -name '*.dmg' -o -name '*.app.zip' \) 2>/dev/null); do
              cp "$f" release-gtk/ ; found=1
            done
            [ "$found" = 1 ] || { echo "::error::missing GTK macOS ${arch} package"; exit 1; }
          done
          for dir in release-qt6 release-gtk; do
            (cd "$dir" && sha256sum * > SHA256SUMS.txt)
          done
          # screenshots ride along with the Qt6 release (after the sums:
          # they are not downloads)
          find dist/vrecord-screenshots -name 'screenshot-*.png' -exec cp {} release-qt6/ \; 2>/dev/null || true
          ls -la release-qt6 release-gtk

      # each release: Release/release-notes/<flavour>-<tag>.md when it exists
      # (@SCREENSHOTS@, @DL@, @TAG@ filled in), otherwise generated notes
      - name: Create the releases and upload the files
        shell: bash
        run: |
          set -euo pipefail
          for flavour in qt6 gtk; do
            TAG="${flavour}-${RELEASE_TAG}"
            if [ "$flavour" = qt6 ]; then
              TITLE="Vrecord ${RELEASE_TAG} - Windows (Qt6)"
            else
              TITLE="Vrecord ${RELEASE_TAG} - GTK (Windows, Linux, macOS)"
            fi
            NOTES_SRC="src/Release/release-notes/${TAG}.md"
            NOTE_ARGS=(--generate-notes)
            if [ -f "$NOTES_SRC" ]; then
              shopt -s nullglob
              bash src/Release/ci/render-release-notes.sh "$NOTES_SRC" "$TAG" "$REPO" release-${flavour}/screenshot-*.png > "notes-${flavour}.md"
              shopt -u nullglob
              NOTE_ARGS=(--notes-file "notes-${flavour}.md")
              echo "${TAG}: notes from ${NOTES_SRC}"
            else
              echo "${TAG}: no ${NOTES_SRC} - generated notes"
            fi
            KIND=(--draft)
            [ "$PRERELEASE" = "true" ] && KIND=(--prerelease)
            if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
              echo "release ${TAG} already exists"
              [ -f "notes-${flavour}.md" ] && gh release edit "$TAG" --repo "$REPO" --notes-file "notes-${flavour}.md"
            else
              # the flavour tag is created on the release commit (a draft's
              # tag appears when it is published)
              gh release create "$TAG" --repo "$REPO" --target "$RELEASE_SHA" \
                --title "$TITLE" "${KIND[@]}" "${NOTE_ARGS[@]}"
            fi
            gh release upload "$TAG" release-${flavour}/* --repo "$REPO" --clobber
          done

      - name: Summary
        shell: bash
        run: |
          {
            echo "### Vrecord ${RELEASE_TAG}"
            if [ "$PRERELEASE" = "true" ]; then
              echo "Published as **pre-releases** (the Windows updater does not offer them)."
            else
              echo "Created as **drafts**: publish both to make them the latest releases (the Qt6 one is what the Windows updater offers)."
            fi
            for flavour in qt6 gtk; do
              TAG="${flavour}-${RELEASE_TAG}"
              echo
              echo "#### ${TAG}"
              echo "https://github.com/${REPO}/releases/tag/${TAG}"
              echo
              for f in release-${flavour}/*; do
                n="$(basename "$f")"
                case "$n" in screenshot-*) continue ;; esac
                echo "- [${n}](https://github.com/${REPO}/releases/download/${TAG}/${n})"
              done
              echo
              echo '```'
              cat "release-${flavour}/SHA256SUMS.txt"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
