name: Build and Release

# Vrecord has two release lines in this repository, each from its own tag:
#
#   v<x.y.z>              the Qt6 GUI: its own semantic version
#   (e.g. v1.0.0)         (qt6/VERSION). Builds and tests Windows, Linux
#                         and macOS, then creates the release with
#                           vrecord-qt6_<x.y.z>_windows_x86_64_setup.exe
#                           vrecord-qt6_<x.y.z>_windows_x86_64_portable.zip
#                           vrecord-qt6_<x.y.z>_linux_amd64.deb (needs the GTK vrecord .deb)
#                           vrecord-qt6_<x.y.z>_macos_<x86_64|arm64>.app.zip
#                           + screenshots of the Qt6 tabs
#
#   v<YYYY.MM.DD>-gtk     the GTK interface, following upstream vrecord's
#   (e.g. v2026.11.26-gtk) date version (VERSION in the vrecord script).
#                         Builds and tests Windows, Linux and macOS, then
#                         creates the release with
#                           vrecord-gtk_<date>_windows_x86_64_portable.zip
#                           vrecord-gtk_<date>_linux_amd64.deb / _linux_x86_64.AppImage
#                           vrecord-gtk_<date>_macos_<arch>.dmg / .app.zip
#
# Each release has its own SHA256SUMS.txt and its notes from
# Release/release-notes/<tag>.md (see Release/ci/render-release-notes.sh);
# without one, generated notes.
#
# Release kinds:
#   v1.0.0 / v2026.11.26-gtk        created as a DRAFT (publish by hand; the
#                                   Windows updater only offers published,
#                                   non-pre Qt6 releases)
#   v1.0.0-rc1 / v2026.11.26-rc1-gtk  a '-suffix' before -gtk makes a
#                                   PRE-RELEASE, published straight away
#
# The tag must match its version: qt6/VERSION for v<x.y.z>, the script's
# VERSION for -gtk tags.
#
# Trigger: push a tag, or run manually with create_release + tag_name (a
# missing tag is created on the commit the run was started from; tick
# prerelease to force a pre-release). A manual run without create_release
# only builds and tests.

permissions:
  contents: write
  actions: write

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create a GitHub release and upload the built binaries"
        required: false
        default: false
        type: boolean
      tag_name:
        description: "Tag to release: v1.0.0 (Qt6) or v2026.11.26-gtk (GTK); created if missing"
        required: false
        type: string
      prerelease:
        description: "Mark as a pre-release (automatic for tags with a -suffix)"
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}-${{ github.event.inputs.tag_name }}
  cancel-in-progress: false

jobs:
  resolve-tag:
    name: Resolve release tag
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      checkout_ref: ${{ steps.resolve.outputs.checkout_ref }}
      publish_release: ${{ steps.resolve.outputs.publish_release }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      flavour: ${{ steps.resolve.outputs.flavour }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve, create (manual runs) and validate the tag
        id: resolve
        shell: bash
        env:
          INPUT_CREATE: ${{ github.event.inputs.create_release }}
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
          INPUT_PRE: ${{ github.event.inputs.prerelease }}
        run: |
          set -euo pipefail
          PUBLISH="true"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "$INPUT_CREATE" = "true" ]; then
              RAW="$INPUT_TAG"
              [ -n "$RAW" ] || { echo "::error::tag_name is required with create_release"; exit 1; }
            else
              PUBLISH="false"; RAW=""
            fi
          else
            RAW="${{ github.ref_name }}"
          fi
          if [ "$PUBLISH" != "true" ]; then
            # build-only run: build everything
            { echo "release_tag="; echo "checkout_ref=${{ github.ref }}"
              echo "publish_release=false"; echo "prerelease=false"; echo "flavour=all"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          RAW="${RAW#refs/tags/}"
          [[ "$RAW" == v* ]] || RAW="v${RAW}"

          # which release line
          if [[ "$RAW" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}(-[0-9A-Za-z.]+)?-gtk$ ]]; then
            FLAVOUR=gtk
            BASE="${RAW%-gtk}"
          elif [[ "$RAW" =~ ^v[0-9]{1,3}\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ && "$RAW" != *-gtk ]]; then
            FLAVOUR=qt6
            BASE="$RAW"
          else
            echo "::error::Invalid tag '$RAW': expected v<x.y.z>[-suffix] (Qt6, e.g. v1.0.0) or v<YYYY.MM.DD>[-suffix]-gtk (GTK, e.g. v2026.11.26-gtk)"; exit 1
          fi
          PRE="false"
          if [[ "$BASE" == *-* ]] || [ "$INPUT_PRE" = "true" ]; then PRE="true"; fi

          # manual run: create the tag on this commit if it does not exist yet
          # (a tag pushed with GITHUB_TOKEN does not start another run)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && \
             ! git ls-remote --exit-code --tags origin "refs/tags/${RAW}" > /dev/null 2>&1; then
            git tag "$RAW" "${{ github.sha }}"
            git push origin "refs/tags/${RAW}"
            echo "created tag ${RAW} on ${{ github.sha }}"
          fi
          # the tag must exist on this repository (retry: a just-pushed tag can lag)
          for attempt in $(seq 1 12); do
            if git ls-remote --exit-code --tags origin "refs/tags/${RAW}" > /dev/null 2>&1; then break; fi
            [ "$attempt" = 12 ] && { echo "::error::tag ${RAW} not found on ${{ github.repository }}"; exit 1; }
            echo "tag ${RAW} not visible yet (${attempt}/12); waiting 5 s"; sleep 5
          done

          # the version before any -suffix must match the line's version at that tag
          git fetch -q origin "refs/tags/${RAW}:refs/tags/${RAW}" 2>/dev/null || true
          if [ "$FLAVOUR" = qt6 ]; then
            VERSION="$(git show "refs/tags/${RAW}:qt6/VERSION" | head -n 1 | tr -d '[:space:]')"
            WHERE="qt6/VERSION"
          else
            VERSION="$(git show "refs/tags/${RAW}:vrecord" | sed -nE 's/^VERSION="([0-9.-]+)"/\1/p')"
            WHERE="VERSION in the vrecord script"
          fi
          NUMBERS="${BASE%%-*}"
          digits() { echo "$1" | grep -oE '[0-9]+' | sed -E 's/^0+([0-9])/\1/' | tr '\n' '.' ; }
          if [ "$(digits "$VERSION")" != "$(digits "$NUMBERS")" ]; then
            echo "::error::tag ${RAW} does not match ${WHERE} (${VERSION})"
            exit 1
          fi
          echo "tag ${RAW}: ${FLAVOUR} release, version ${VERSION} (prerelease=${PRE})"
          { echo "release_tag=${RAW}"; echo "checkout_ref=refs/tags/${RAW}"
            echo "publish_release=true"; echo "prerelease=${PRE}"; echo "flavour=${FLAVOUR}"; } >> "$GITHUB_OUTPUT"

  build-linux:
    name: Build Linux
    needs: resolve-tag
    uses: ./.github/workflows/build-linux.yml
    with:
      checkout_ref: ${{ needs.resolve-tag.outputs.checkout_ref }}
    secrets: inherit

  build-windows:
    name: Build Windows
    needs: resolve-tag
    uses: ./.github/workflows/build-windows.yml
    with:
      checkout_ref: ${{ needs.resolve-tag.outputs.checkout_ref }}
    secrets: inherit

  build-macos:
    name: Build macOS
    needs: resolve-tag
    uses: ./.github/workflows/build-macos.yml
    with:
      checkout_ref: ${{ needs.resolve-tag.outputs.checkout_ref }}
      # a release builds every Mac architecture (Apple-silicon runners)
      all_arches: true
    secrets: inherit

  upload-release-assets:
    name: Create the release
    needs: [resolve-tag, build-linux, build-windows, build-macos]
    if: ${{ needs.resolve-tag.outputs.publish_release == 'true' }}
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ needs.resolve-tag.outputs.release_tag }}
      PRERELEASE: ${{ needs.resolve-tag.outputs.prerelease }}
      FLAVOUR: ${{ needs.resolve-tag.outputs.flavour }}
      REPO: ${{ github.repository }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      # the release notes (Release/release-notes/<tag>.md) and their renderer
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-tag.outputs.checkout_ref }}
          path: src

      - name: Download every build artifact
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Collect the release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          need() {   # need <label> <file name glob>
            local found
            found="$(find dist -type f -name "$2" | head -n 1)"
            [ -n "$found" ] || { echo "::error::missing $1 ($2)"; exit 1; }
            cp "$found" release/
          }
          if [ "$FLAVOUR" = qt6 ]; then
            need "Qt6 installer"        'vrecord-qt6_*_windows_x86_64_setup.exe'
            need "Qt6 portable zip"     'vrecord-qt6_*_windows_x86_64_portable.zip'
            need "Qt6 .deb"             'vrecord-qt6_*_linux_*.deb'
            need "Qt6 macOS x86_64"     'vrecord-qt6_*_macos_x86_64.app.zip'
            need "Qt6 macOS arm64"      'vrecord-qt6_*_macos_arm64.app.zip'
          else
            need "GTK Windows portable" 'vrecord-gtk_*_windows_x86_64_portable.zip'
            need "GTK .deb"             'vrecord-gtk_*_linux_amd64.deb'
            need "GTK AppImage"         'vrecord-gtk_*_linux_x86_64.AppImage'
            for arch in x86_64 arm64 universal; do
              found=0
              for f in $(find "dist/vrecord-gtk-macos-${arch}" -type f \( -name 'vrecord-gtk_*.dmg' -o -name 'vrecord-gtk_*.app.zip' \) 2>/dev/null); do
                cp "$f" release/ ; found=1
              done
              [ "$found" = 1 ] || { echo "::error::missing GTK macOS ${arch} package"; exit 1; }
            done
          fi
          (cd release && sha256sum * > SHA256SUMS.txt)
          # screenshots ride along with a Qt6 release (after the sums: they
          # are not downloads)
          if [ "$FLAVOUR" = qt6 ]; then
            find dist/vrecord-screenshots -name 'screenshot-*.png' -exec cp {} release/ \; 2>/dev/null || true
          fi
          ls -la release

      # Release/release-notes/<tag>.md when it exists (@SCREENSHOTS@, @DL@
      # and @TAG@ filled in), otherwise generated notes
      - name: Create the release and upload the files
        shell: bash
        run: |
          set -euo pipefail
          if [ "$FLAVOUR" = qt6 ]; then
            TITLE="Vrecord ${RELEASE_TAG} - Qt6 (Windows, Linux, macOS)"
          else
            TITLE="Vrecord ${RELEASE_TAG%-gtk} - GTK (Windows, Linux, macOS)"
          fi
          # screenshots go to the release-assets branch (<tag>/), so the
          # notes' gallery shows them while the release is still a draft
          # (a draft's own downloads only resolve once it is published)
          if ls release/screenshot-*.png > /dev/null 2>&1; then
            if git clone -q --depth 1 --branch release-assets "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git" assets 2>/dev/null; then
              :
            else
              git init -q assets && git -C assets checkout -q -b release-assets
              git -C assets remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git"
            fi
            mkdir -p "assets/${RELEASE_TAG}"
            cp release/screenshot-*.png "assets/${RELEASE_TAG}/"
            git -C assets config user.name "github-actions[bot]"
            git -C assets config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C assets add -A
            if ! git -C assets diff --cached --quiet; then
              git -C assets commit -q -m "Screenshots for release ${RELEASE_TAG}"
              git -C assets push -q origin release-assets
            fi
            export IMAGE_BASE="https://raw.githubusercontent.com/${REPO}/release-assets/${RELEASE_TAG}"
          fi
          NOTES_SRC="src/Release/release-notes/${RELEASE_TAG}.md"
          NOTE_ARGS=(--generate-notes)
          if [ -f "$NOTES_SRC" ]; then
            shopt -s nullglob
            bash src/Release/ci/render-release-notes.sh "$NOTES_SRC" "$RELEASE_TAG" "$REPO" release/screenshot-*.png > notes.md
            shopt -u nullglob
            NOTE_ARGS=(--notes-file notes.md)
            echo "notes from ${NOTES_SRC}"
          else
            echo "no ${NOTES_SRC} - generated notes"
          fi
          KIND=(--draft)
          [ "$PRERELEASE" = "true" ] && KIND=(--prerelease)
          if gh release view "$RELEASE_TAG" --repo "$REPO" > /dev/null 2>&1; then
            echo "release ${RELEASE_TAG} already exists"
            [ -f notes.md ] && gh release edit "$RELEASE_TAG" --repo "$REPO" --notes-file notes.md
          else
            gh release create "$RELEASE_TAG" --repo "$REPO" --verify-tag \
              --title "$TITLE" "${KIND[@]}" "${NOTE_ARGS[@]}"
          fi
          gh release upload "$RELEASE_TAG" release/* --repo "$REPO" --clobber

      - name: Summary
        shell: bash
        run: |
          {
            echo "### Vrecord ${RELEASE_TAG} (${FLAVOUR})"
            if [ "$PRERELEASE" = "true" ]; then
              echo "Published as a **pre-release** (the Windows updater does not offer it)."
            else
              echo "Created as a **draft**: publish it to make it a current release."
            fi
            echo
            echo "https://github.com/${REPO}/releases/tag/${RELEASE_TAG}"
            echo
            echo "#### Downloads"
            for f in release/*; do
              n="$(basename "$f")"
              case "$n" in screenshot-*) continue ;; esac
              echo "- [${n}](https://github.com/${REPO}/releases/download/${RELEASE_TAG}/${n})"
            done
            echo
            echo "#### SHA256"
            echo '```'
            cat release/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
