name: Build Windows

# Windows portable package: the Qt6 frontend + the vrecord bash backend with
# every tool it drives (ffmpeg-ma with DeckLink + drawtext, gtkdialog for the
# legacy UI, xmlstarlet, deckcontrol, MediaInfo / MediaConch / DVRescue CLIs,
# dvpackager, MKVToolNix, mpv), built in MSYS2 UCRT64 from pinned sources
# (Release/ci/windows-build-deps.sh), then tested without capture hardware
# (Release/ci/windows-package-tests.sh). Called by build-and-test.yml and
# build-and-release.yml; can also be run on its own.

on:
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: "Branch, tag or SHA to build (default: the selected ref)"
        required: false
        type: string
  workflow_call:
    inputs:
      checkout_ref:
        required: false
        type: string
        default: ""

jobs:
  build:
    name: Build Windows portable (x86_64)
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: msys2 {0}
    env:
      VRECORD_BUILD: /d/vrecord-build
      # the updater offers the published releases of the repository it was
      # built from (a fork updates from the fork)
      VRECORD_UPDATE_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Set up MSYS2 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git make autoconf automake libtool bison flex texinfo patch
            diffutils zip unzip p7zip perl
          pacboy: >-
            toolchain:p cmake:p ninja:p pkgconf:p nasm:p
            qt6-base:p qt6-svg:p qt6-tools:p
            SDL2:p x264:p openh264:p freetype:p harfbuzz:p fontconfig:p fribidi:p
            gtk3:p libxml2:p libxslt:p nsis:p opus:p

      # cached build inputs (ffmpeg-ma, gtkdialog, ...): keyed on the recipe
      # AND the week, so binaries never drift far from the MSYS2 DLLs the
      # package collects alongside them
      - name: Cache key
        id: key
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      # restore + save as separate steps: the save also runs when a later
      # dependency fails, so finished ones (ffmpeg-ma takes the longest) are
      # kept for the next run; each step in the deps script skips what exists
      - name: Restore build inputs
        id: deps-cache
        uses: actions/cache/restore@v5
        with:
          path: D:\vrecord-build
          key: windows-deps-${{ steps.key.outputs.week }}-${{ hashFiles('Release/ci/windows-build-deps.sh', 'Release/build-ffmpeg-windows.sh', 'Release/vendor/**', 'Release/patches/**') }}
          restore-keys: |
            windows-deps-${{ steps.key.outputs.week }}-${{ hashFiles('Release/ci/windows-build-deps.sh', 'Release/build-ffmpeg-windows.sh', 'Release/vendor/**', 'Release/patches/**') }}-

      - name: Build dependencies (pinned sources + vendored patches)
        id: deps
        run: bash Release/ci/windows-build-deps.sh

      - name: Save build inputs
        if: always() && steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: D:\vrecord-build
          key: windows-deps-${{ steps.key.outputs.week }}-${{ hashFiles('Release/ci/windows-build-deps.sh', 'Release/build-ffmpeg-windows.sh', 'Release/vendor/**', 'Release/patches/**') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build the portable package (Qt6 frontend + backend + tools)
        id: portable
        run: bash Release/build-windows-portable.sh

      # before the package tests: they write run logs into the package folder
      - name: Build the installer (NSIS)
        id: installer
        run: bash Release/build-windows-installer.sh

      # the two release packages: Qt6 (with its self-test) and GTK
      - name: Test the Qt6 package (no capture hardware)
        run: |
          VERSION="$(sed -nE 's/^VERSION="([0-9.-]+)"/\1/p' vrecord)"
          QTV="$(head -n 1 qt6/VERSION | tr -d '[:space:]')"   # the Qt6 GUI's own version
          bash Release/ci/windows-package-tests.sh "Release/artifacts/vrecord-qt6_windows_${QTV}"

      - name: Test the GTK package
        run: |
          VERSION="$(sed -nE 's/^VERSION="([0-9.-]+)"/\1/p' vrecord)"
          QTV="$(head -n 1 qt6/VERSION | tr -d '[:space:]')"   # the Qt6 GUI's own version
          bash Release/ci/windows-package-tests.sh "Release/artifacts/vrecord-gtk_windows_${VERSION}"

      - name: Test the installer and the updater (fake release, no network)
        run: |
          VERSION="$(sed -nE 's/^VERSION="([0-9.-]+)"/\1/p' vrecord)"
          QTV="$(head -n 1 qt6/VERSION | tr -d '[:space:]')"   # the Qt6 GUI's own version
          A=Release/artifacts
          bash Release/ci/windows-update-tests.sh "$A/vrecord-qt6_windows_${QTV}" \
            "$A/vrecord-qt6_${QTV}_windows_x86_64_portable.zip" "$A/vrecord-qt6_${QTV}_windows_x86_64_setup.exe"

      # one PNG per Qt6 tab for the release notes (off-screen, default
      # settings, no home paths): Vrecord.exe --screenshots. A failure
      # here never fails the build - the release then has no gallery.
      - name: Screenshots for the release notes
        id: screenshots
        continue-on-error: true
        run: |
          VERSION="$(sed -nE 's/^VERSION="([0-9.-]+)"/\1/p' vrecord)"
          QTV="$(head -n 1 qt6/VERSION | tr -d '[:space:]')"   # the Qt6 GUI's own version
          PKG="Release/artifacts/vrecord-qt6_windows_${QTV}"
          OUT="$(pwd)/artifacts/screenshots"
          mkdir -p "$OUT"
          ( cd "$PKG" && QT_QPA_PLATFORM=offscreen /usr/bin/timeout 120 ./Vrecord.exe --screenshots "$(cygpath -w "$OUT")" )
          # vrecord-qt6-01-video-preview.png -> screenshot-01-video-preview.png
          for f in "$OUT"/vrecord-qt6-*.png ; do mv "$f" "$OUT/screenshot-${f##*/vrecord-qt6-}" ; done
          ls -la "$OUT"
          ls "$OUT"/screenshot-*.png > /dev/null

      - name: Upload the screenshots
        uses: actions/upload-artifact@v7
        if: steps.screenshots.outcome == 'success'
        with:
          name: vrecord-screenshots
          path: artifacts/screenshots/*.png
          if-no-files-found: ignore

      # collected even when the tests fail (the job still fails, so a release
      # never takes it): the packages can then be downloaded and debugged
      - name: Collect artifacts
        if: always() && steps.portable.outcome == 'success'
        run: |
          VERSION="$(sed -nE 's/^VERSION="([0-9.-]+)"/\1/p' vrecord)"
          QTV="$(head -n 1 qt6/VERSION | tr -d '[:space:]')"   # the Qt6 GUI's own version
          A=Release/artifacts
          mkdir -p artifacts/qt6-portable artifacts/qt6-setup artifacts/gtk-portable
          cp "$A/vrecord-qt6_${QTV}_windows_x86_64_portable.zip" artifacts/qt6-portable/
          cp "$A/vrecord-gtk_${VERSION}_windows_x86_64_portable.zip" artifacts/gtk-portable/
          if [ -f "$A/vrecord-qt6_${QTV}_windows_x86_64_setup.exe" ]; then
            cp "$A/vrecord-qt6_${QTV}_windows_x86_64_setup.exe" artifacts/qt6-setup/
          fi
          ls -la artifacts/*

      # one artifact per download, so each is downloadable on its own
      - name: Upload the Qt6 installer
        uses: actions/upload-artifact@v7
        if: always() && steps.installer.outcome == 'success'
        with:
          name: vrecord-qt6-windows-x86_64-setup
          path: artifacts/qt6-setup/
          if-no-files-found: error

      - name: Upload the Qt6 portable package
        uses: actions/upload-artifact@v7
        if: always() && steps.portable.outcome == 'success'
        with:
          name: vrecord-qt6-windows-x86_64-portable
          path: artifacts/qt6-portable/
          if-no-files-found: error

      - name: Upload the GTK portable package
        uses: actions/upload-artifact@v7
        if: always() && steps.portable.outcome == 'success'
        with:
          name: vrecord-gtk-windows-x86_64-portable
          path: artifacts/gtk-portable/
          if-no-files-found: error
