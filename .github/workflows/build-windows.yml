name: Build Windows

# Windows portable package: the Qt6 frontend + the vrecord bash backend with
# every tool it drives (ffmpeg-ma with DeckLink + drawtext, gtkdialog for the
# legacy UI, xmlstarlet, deckcontrol, MediaInfo / MediaConch / DVRescue CLIs,
# dvpackager, MKVToolNix, mpv), built in MSYS2 UCRT64 from pinned sources
# (Release/ci/windows-build-deps.sh), then tested without capture hardware
# (Release/ci/windows-package-tests.sh). Called by build-and-test.yml and
# build-and-release.yml; can also be run on its own.

on:
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: "Branch, tag or SHA to build (default: the selected ref)"
        required: false
        type: string
  workflow_call:
    inputs:
      checkout_ref:
        required: false
        type: string
        default: ""

jobs:
  build:
    name: Build Windows portable (x86_64)
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: msys2 {0}
    env:
      VRECORD_BUILD: /d/vrecord-build
      # the updater offers the published releases of the repository it was
      # built from (a fork updates from the fork)
      VRECORD_UPDATE_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Set up MSYS2 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git make autoconf automake libtool bison flex texinfo patch
            diffutils zip unzip p7zip perl
          pacboy: >-
            toolchain:p cmake:p ninja:p pkgconf:p nasm:p
            qt6-base:p qt6-svg:p qt6-tools:p
            SDL2:p x264:p openh264:p freetype:p harfbuzz:p fontconfig:p fribidi:p
            gtk3:p libxml2:p libxslt:p nsis:p opus:p

      # cached build inputs (ffmpeg-ma, gtkdialog, ...): keyed on the recipe
      # AND the week, so binaries never drift far from the MSYS2 DLLs the
      # package collects alongside them
      - name: Cache key
        id: key
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      # restore + save as separate steps: the save also runs when a later
      # dependency fails, so finished ones (ffmpeg-ma takes the longest) are
      # kept for the next run; each step in the deps script skips what exists
      - name: Restore build inputs
        id: deps-cache
        uses: actions/cache/restore@v5
        with:
          path: D:\vrecord-build
          key: windows-deps-${{ steps.key.outputs.week }}-${{ hashFiles('Release/ci/windows-build-deps.sh', 'Release/build-ffmpeg-windows.sh', 'Release/vendor/**', 'Release/patches/**') }}
          restore-keys: |
            windows-deps-${{ steps.key.outputs.week }}-${{ hashFiles('Release/ci/windows-build-deps.sh', 'Release/build-ffmpeg-windows.sh', 'Release/vendor/**', 'Release/patches/**') }}-

      - name: Build dependencies (pinned sources + vendored patches)
        id: deps
        run: bash Release/ci/windows-build-deps.sh

      - name: Save build inputs
        if: always() && steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: D:\vrecord-build
          key: windows-deps-${{ steps.key.outputs.week }}-${{ hashFiles('Release/ci/windows-build-deps.sh', 'Release/build-ffmpeg-windows.sh', 'Release/vendor/**', 'Release/patches/**') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build the portable package (Qt6 frontend + backend + tools)
        id: portable
        run: bash Release/build-windows-portable.sh

      # before the package tests: they write run logs into the package folder
      - name: Build the installer (NSIS)
        id: installer
        run: bash Release/build-windows-installer.sh

      - name: Test the package (no capture hardware)
        run: |
          VERSION="$(sed -nE 's/^VERSION="([0-9.-]+)"/\1/p' vrecord)"
          bash Release/ci/windows-package-tests.sh "Release/artifacts/vrecord_windows_${VERSION}"

      - name: Test the installer and the updater (fake release, no network)
        run: |
          VERSION="$(sed -nE 's/^VERSION="([0-9.-]+)"/\1/p' vrecord)"
          A=Release/artifacts
          bash Release/ci/windows-update-tests.sh "$A/vrecord_windows_${VERSION}" \
            "$A/vrecord_${VERSION}_windows_portable.zip" "$A/vrecord_${VERSION}_windows_setup.exe"

      # collected even when the tests fail (the job still fails, so a release
      # never takes it): the package can then be downloaded and debugged
      - name: Collect artifact
        if: always() && steps.portable.outcome == 'success'
        run: |
          VERSION="$(sed -nE 's/^VERSION="([0-9.-]+)"/\1/p' vrecord)"
          mkdir -p artifacts/portable artifacts/installer
          cp "Release/artifacts/vrecord_${VERSION}_windows_portable.zip" "artifacts/portable/vrecord_${VERSION}_windows_x86_64_portable.zip"
          if [ -f "Release/artifacts/vrecord_${VERSION}_windows_setup.exe" ]; then
            cp "Release/artifacts/vrecord_${VERSION}_windows_setup.exe" "artifacts/installer/vrecord_${VERSION}_windows_x86_64_setup.exe"
          fi
          ls -la artifacts/*

      # two artifacts, so the installer is downloadable on its own
      - name: Upload the portable package
        uses: actions/upload-artifact@v7
        if: always() && steps.portable.outcome == 'success'
        with:
          name: vrecord-windows-x86_64-portable
          path: artifacts/portable/
          if-no-files-found: error

      - name: Upload the installer
        uses: actions/upload-artifact@v7
        if: always() && steps.installer.outcome == 'success'
        with:
          name: vrecord-windows-x86_64-setup
          path: artifacts/installer/
          if-no-files-found: error
