name: Build Linux

# Called by build-and-test.yml (every push / PR) and release.yml (tags);
# can also be run on its own.
on:
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: "Branch, tag or SHA to build (default: the selected ref)"
        required: false
        type: string
  workflow_call:
    inputs:
      checkout_ref:
        required: false
        type: string
        default: ""

jobs:
  build:
    runs-on: ubuntu-24.04
    # a normal run takes ~15 min; a runner whose DNS died left apt retrying
    # for 2 h 20 min (2026-11-11): cap the job and make apt fail fast instead
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Install build dependencies
        timeout-minutes: 50
        run: |
          APT_NET="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get $APT_NET update
          sudo apt-get $APT_NET install -y --no-install-recommends \
            build-essential curl libgtk2.0-dev libgtk-3-dev bison flex texinfo \
            git mkvtoolnix gnuplot xmlstarlet mpv mediaconch \
            libiec61883-dev libraw1394-dev libavc1394-dev libavc1394-tools \
            binutils file desktop-file-utils librsvg2-bin zlib1g-dev pkg-config
          # homebrew-on-linux for ffmpeg-ma (mediaarea tap) and a VENDORED
          # GUI stack. Two annotations were seen here:
          # 1. 'gtk+ has been deprecated ... disabled 2027-08-28' - FIXED by
          #    vendoring: a private in-runner tap holds the current core
          #    gtk+ formula with the deprecation markers stripped, plus the
          #    amiaos gtkdialog 0.8.5e formula (same source tarball and
          #    patch) repointed at our vendored gtk+, so the build never
          #    touches the deprecated core gtk+ formula.
          # 2. 'Landlock ABI 10 or later ... found ABI 8' - the runner
          #    kernel's sandbox capability; brew applies partial
          #    restrictions. Harmless; brew install runs without
          #    GITHUB_ACTIONS so brew logs it as a plain line instead of
          #    raising a workflow warning annotation.
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew tap amiaopensource/amiaos
          brew tap mediaarea/mediaarea
          # CI brew sets HOMEBREW_REQUIRE_TAP_TRUST; trust the taps we pull formulas from
          brew trust --tap amiaopensource/amiaos
          brew trust --tap mediaarea/mediaarea
          # tap-new commits the tap skeleton, so the runner needs an identity
          git config --global user.email "ci@vrecord.invalid"
          git config --global user.name "vrecord CI"
          brew tap-new harrypm/vendored
          # the CI trust requirement covers local taps too
          brew trust --tap harrypm/vendored
          # vendored gtk+: the current core gtk+ formula with the
          # deprecation/disable markers stripped, so our copy outlives the
          # 2027-08-28 disable date of the core formula (fetch the .rb from
          # the homebrew-core GitHub repo: API-mode brew has no local core
          # tap checkout, and brew cat comes up empty for API-loaded
          # deprecated formulae)
          curl -fsSL https://raw.githubusercontent.com/Homebrew/homebrew-core/HEAD/Formula/g/gtk+.rb \
            | sed '/deprecate!/d; /disable!/d' \
            > "$(brew --repo harrypm/vendored)/Formula/gtk+.rb"
          # vendored gtkdialog: the amiaos 0.8.5e formula (same tarball,
          # same DATA patch) with the runtime dependency repointed at the
          # vendored gtk+
          curl -fsSL https://raw.githubusercontent.com/amiaopensource/homebrew-amiaos/master/gtkdialog.rb \
            | sed 's|depends_on "gtk+"$|depends_on "harrypm/vendored/gtk+"|' \
            > "$(brew --repo harrypm/vendored)/Formula/gtkdialog.rb"
          # fail loudly if either vendored formula came up empty
          VDIR="$(brew --repo harrypm/vendored)/Formula"
          grep -q "^class " "$VDIR/gtk+.rb" || { echo "::error::vendored gtk+ formula is empty or invalid"; exit 1; }
          grep -q "^class " "$VDIR/gtkdialog.rb" || { echo "::error::vendored gtkdialog formula is empty or invalid"; exit 1; }
          # decklinksdk = the BMD API headers deckcontrol compiles against
          env -u GITHUB_ACTIONS brew install ffmpeg-ma cowsay amiaopensource/amiaos/decklinksdk harrypm/vendored/gtkdialog
          # deckcontrol: bavc v0.6 (the same pinned tarball the Windows build
          # uses), built OUTSIDE brew - the amiaos formula's Makefile links
          # `gcc -lstdc++ ... *.o`, and with Ubuntu's --as-needed the library
          # before the objects is dropped (undefined operator delete / typeinfo
          # vtables, 2026-11-11). g++ with the libraries last links correctly.
          curl -fsSL -o deckcontrol-0.6.tar.gz https://github.com/bavc/deckcontrol/archive/refs/tags/v0.6.tar.gz
          echo "e4a184ff6ec64aef8cccd15712797e7507d2de1ce873396703d575047ae1463e  deckcontrol-0.6.tar.gz" | sha256sum -c -
          tar -xzf deckcontrol-0.6.tar.gz
          BMSDK="$(brew --prefix decklinksdk)/include"
          (cd deckcontrol-0.6 && g++ -O2 -I"$BMSDK" deckcontrol.cpp "$BMSDK/DeckLinkAPIDispatch.cpp" -o deckcontrol -lpthread -ldl)
          sudo install -m755 deckcontrol-0.6/deckcontrol /usr/local/bin/deckcontrol
          deckcontrol 2>&1 | grep -m1 -i "getcurrentstate" || { echo "::error::deckcontrol did not start"; exit 1; }
          # dvrescue + dvpackager: built OUTSIDE brew (brew's superenv
          # scrubs pkg-config and hides the system libavc1394 the build
          # needs; outside, the apt -dev libs are visible). Installs the
          # dvrescue binary and the dvpackager script to /usr/local/bin.
          # The FromSource tarball has no top-level configure: its
          # CLI_Compile.sh builds static ZenLib + MediaInfoLib, then dvrescue
          # in dvrescue/Project/GNU/CLI. It exits 0 even when a stage fails,
          # so the binary is checked explicitly.
          curl -fsSL -o dvrescue-src.tar.xz https://mediaarea.net/download/binary/dvrescue/24.07/dvrescue_CLI_24.07_GNU_FromSource.tar.xz
          echo "c3ff012d0cf6c0bd5c82771f4cb19d2b57a97dfc71e7cef30d04fc65ec071038  dvrescue-src.tar.xz" | sha256sum -c -
          tar -xJf dvrescue-src.tar.xz
          (cd dvrescue_CLI_GNU_FromSource && ./CLI_Compile.sh)
          DVR_BIN=dvrescue_CLI_GNU_FromSource/dvrescue/Project/GNU/CLI/dvrescue
          test -x "$DVR_BIN" || { echo "::error::dvrescue did not build (CLI_Compile.sh)"; exit 1; }
          sudo install -m755 "$DVR_BIN" /usr/local/bin/dvrescue
          sudo install -m755 dvrescue_CLI_GNU_FromSource/dvrescue/Source/GUI/dvrescue/dvrescue/dvpackager /usr/local/bin/dvpackager
          dvrescue --version
          cd "$GITHUB_WORKSPACE"

      - name: Build .deb package
        id: deb
        run: |
          chmod +x Release/build-deb.sh
          ./Release/build-deb.sh

      - name: Build .AppImage (portable)
        id: appimage
        if: always() && steps.deb.outcome != 'cancelled'
        run: |
          chmod +x Release/build-appimage.sh
          ./Release/build-appimage.sh

      # two artifacts, so the .deb and the portable AppImage download separately
      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p artifacts/deb artifacts/appimage
          cp Release/artifacts/*.deb artifacts/deb/ 2>/dev/null || true
          cp Release/artifacts/*.AppImage artifacts/appimage/ 2>/dev/null || true
          ls -la artifacts/*

      - name: Upload the .deb
        uses: actions/upload-artifact@v7
        if: always() && steps.deb.outcome == 'success'
        with:
          name: vrecord-linux-amd64-deb
          path: artifacts/deb/
          if-no-files-found: error

      - name: Upload the AppImage (portable)
        uses: actions/upload-artifact@v7
        if: always() && steps.appimage.outcome == 'success'
        with:
          name: vrecord-linux-x86_64-appimage
          path: artifacts/appimage/
          if-no-files-found: error

      # releases are published by release.yml from these artifacts
