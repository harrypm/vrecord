name: Build Linux

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl libgtk2.0-dev libgtk-3-dev bison flex texinfo \
            git mkvtoolnix gnuplot xmlstarlet mpv mediaconch \
            libiec61883-dev libraw1394-dev libavc1394-dev libavc1394-tools \
            binutils file desktop-file-utils librsvg2-bin
          # homebrew-on-linux for the tap deps (ffmpeg-ma, gtkdialog).
          # Two known runner annotations surface here, neither fixable in
          # this workflow (documented in the FUTO best-practices Runners
          # Note):
          # 1. 'gtk+ has been deprecated ... disabled on 2027-08-28' - the
          #    amiaos gtkdialog formula builds against brew's gtk+ (gtk2),
          #    which Homebrew deprecated because gtk2 is EOL upstream. This
          #    LINUX BUILD BREAKS ON 2027-08-28 unless the GUI stack
          #    migrates (gtkdialog gtk3, or prebuilt bottles). Tracking
          #    that migration is a project, not a workflow edit.
          # 2. 'Landlock ABI 10 or later is required ... found ABI 8' - the
          #    runner kernel's Landlock LSM is older than brew's sandbox
          #    wants; brew applies partial restrictions. Harmless, goes
          #    away when the runner image updates its kernel.
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew tap amiaopensource/amiaos
          brew tap mediaarea/mediaarea
          # CI brew sets HOMEBREW_REQUIRE_TAP_TRUST; trust the taps we pull formulas from
          brew trust --tap amiaopensource/amiaos
          brew trust --tap mediaarea/mediaarea
          brew install vrecord ffmpeg-ma gtkdialog

      - name: Build .deb package
        run: |
          chmod +x Release/build-deb.sh
          ./Release/build-deb.sh

      - name: Build .AppImage
        run: |
          chmod +x Release/build-appimage.sh
          ./Release/build-appimage.sh

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp Release/artifacts/*.deb artifacts/
          cp Release/artifacts/*.AppImage artifacts/
          ls -la artifacts/

      - uses: actions/upload-artifact@v7
        with:
          name: vrecord-linux
          path: artifacts/
          if-no-files-found: error

      - name: Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/*.deb
            artifacts/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
