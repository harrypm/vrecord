name: Release

# One release for every platform (the vhs-decode model): resolve the tag,
# build + test Linux, Windows and macOS from that tag with the same reusable
# workflows build-and-test.yml uses, then upload every binary to a single
# GitHub release (created as a draft with generated notes; publish it by hand).
#
# The Windows updater (VrecordQt6 > Config > Updates) offers only PUBLISHED
# releases: nothing reaches users until the draft is published. The tag must
# match VERSION in the vrecord script (checked below), and the release must
# carry SHA256SUMS.txt (the updater refuses unverified downloads).
#
# Trigger: push a v* tag, or run manually with create_release + tag_name
# (the tag must already exist). A manual run without create_release only
# builds and tests (no release).

permissions:
  contents: write
  actions: write

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create a GitHub release and upload the built binaries"
        required: false
        default: false
        type: boolean
      tag_name:
        description: "Existing tag to release (e.g. v2026.03.03 or 2026.03.03)"
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}-${{ github.event.inputs.tag_name }}
  cancel-in-progress: false

jobs:
  resolve-tag:
    name: Resolve release tag
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      checkout_ref: ${{ steps.resolve.outputs.checkout_ref }}
      publish_release: ${{ steps.resolve.outputs.publish_release }}
    steps:
      - name: Resolve and validate the tag
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          PUBLISH="true"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.create_release }}" = "true" ]; then
              RAW="${{ github.event.inputs.tag_name }}"
              [ -n "$RAW" ] || { echo "::error::tag_name is required with create_release"; exit 1; }
            else
              PUBLISH="false"
              RAW=""
            fi
          else
            RAW="${{ github.ref_name }}"
          fi
          if [ "$PUBLISH" = "true" ]; then
            RAW="${RAW#refs/tags/}"
            [[ "$RAW" == v* ]] || RAW="v${RAW}"
            if [[ ! "$RAW" =~ ^v[0-9][0-9A-Za-z.+-]*$ ]]; then
              echo "::error::Invalid tag '$RAW' (expected v<version>, e.g. v2026.03.03)"; exit 1
            fi
            # the tag must exist on this repository (retry: a just-pushed tag can lag)
            for attempt in $(seq 1 12); do
              if git ls-remote --exit-code --tags "https://github.com/${{ github.repository }}.git" "refs/tags/${RAW}" > /dev/null 2>&1; then
                break
              fi
              [ "$attempt" = 12 ] && { echo "::error::tag ${RAW} not found on ${{ github.repository }}"; exit 1; }
              echo "tag ${RAW} not visible yet (${attempt}/12); waiting 5 s"; sleep 5
            done
            echo "release_tag=${RAW}" >> "$GITHUB_OUTPUT"
            echo "checkout_ref=refs/tags/${RAW}" >> "$GITHUB_OUTPUT"
          else
            echo "release_tag=" >> "$GITHUB_OUTPUT"
            echo "checkout_ref=${{ github.ref }}" >> "$GITHUB_OUTPUT"
          fi
          echo "publish_release=${PUBLISH}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.resolve.outputs.publish_release == 'true'
        with:
          ref: ${{ steps.resolve.outputs.checkout_ref }}

      # the Windows updater compares the release tag with the VERSION the app
      # was built with: a tag that does not match VERSION would be offered
      # as an update forever (or never)
      - name: The tag matches the vrecord VERSION
        if: steps.resolve.outputs.publish_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -nE 's/^VERSION="([0-9.-]+)"/\1/p' vrecord)"
          TAG="${{ steps.resolve.outputs.release_tag }}"
          digits() { echo "$1" | grep -oE '[0-9]+' | sed -E 's/^0+([0-9])/\1/' | tr '\n' '.' ; }
          if [ "$(digits "$VERSION")" != "$(digits "$TAG")" ]; then
            echo "::error::tag ${TAG} does not match VERSION=\"${VERSION}\" in vrecord - bump VERSION (or tag v${VERSION//-/.})"
            exit 1
          fi
          echo "tag ${TAG} matches VERSION ${VERSION}"

  build-linux:
    name: Build Linux
    needs: resolve-tag
    uses: ./.github/workflows/build-linux.yml
    with:
      checkout_ref: ${{ needs.resolve-tag.outputs.checkout_ref }}
    secrets: inherit

  build-windows:
    name: Build Windows
    needs: resolve-tag
    uses: ./.github/workflows/build-windows.yml
    with:
      checkout_ref: ${{ needs.resolve-tag.outputs.checkout_ref }}
    secrets: inherit

  build-macos:
    name: Build macOS
    needs: resolve-tag
    uses: ./.github/workflows/build-macos.yml
    with:
      checkout_ref: ${{ needs.resolve-tag.outputs.checkout_ref }}
    secrets: inherit

  upload-release-assets:
    name: Upload release assets
    needs: [resolve-tag, build-linux, build-windows, build-macos]
    if: ${{ needs.resolve-tag.outputs.publish_release == 'true' }}
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ needs.resolve-tag.outputs.release_tag }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Download every build artifact
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Name the release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          need() {   # need <label> <glob under dist> <asset name>
            local found
            found="$(find dist -type f -name "$2" | head -n 1)"
            [ -n "$found" ] || { echo "::error::missing $1 ($2)"; exit 1; }
            cp "$found" "release/$3"
          }
          T="$RELEASE_TAG"
          need "Linux .deb"            '*.deb'                          "vrecord_${T}_linux_amd64.deb"
          need "Linux AppImage"        '*.AppImage'                     "vrecord_${T}_linux_x86_64.AppImage"
          need "Windows portable zip"  '*_windows_x86_64_portable.zip'  "vrecord_${T}_windows_x86_64_portable.zip"
          need "Windows installer"     '*_windows_x86_64_setup.exe'     "vrecord_${T}_windows_x86_64_setup.exe"
          for arch in x86_64 arm64 universal; do
            dmg="$(find "dist/vrecord-macos-${arch}" -type f -name '*.dmg' | head -n 1)"
            app="$(find "dist/vrecord-macos-${arch}" -type f -name '*.app.zip' | head -n 1)"
            [ -n "$dmg" ] && cp "$dmg" "release/vrecord_${T}_macos_${arch}.dmg"
            [ -n "$app" ] && cp "$app" "release/vrecord_${T}_macos_${arch}.app.zip"
            [ -n "$dmg$app" ] || { echo "::error::missing macOS ${arch} package"; exit 1; }
          done
          (cd release && sha256sum * > SHA256SUMS.txt)
          ls -la release

      - name: Create the draft release (if needed)
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "release $RELEASE_TAG already exists"
          else
            gh release create "$RELEASE_TAG" --repo "${{ github.repository }}" \
              --title "vrecord $RELEASE_TAG" --draft --generate-notes --verify-tag
          fi

      - name: Upload the binaries
        shell: bash
        run: gh release upload "$RELEASE_TAG" release/* --repo "${{ github.repository }}" --clobber
