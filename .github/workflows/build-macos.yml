name: Build macOS

# Called by build-and-test.yml (every push / PR) and build-and-release.yml (tags);
# can also be run on its own.
on:
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: "Branch, tag or SHA to build (default: the selected ref)"
        required: false
        type: string
  workflow_call:
    inputs:
      checkout_ref:
        required: false
        type: string
        default: ""

jobs:
  build:
    name: Build macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Discrete per-arch builds on native runners, plus a universal
          # package. Note: gtkdialog, MKVToolNix, and dvrescue have no arm64
          # prebuilt binaries and are bundled as x86_64 in every package
          # (Rosetta 2 on Apple Silicon); see Release/Release_Mac.sh.
          - arch: x86_64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
          - arch: universal
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Install build dependencies
        run: |
          brew install bison flex texinfo libxml2 libxslt automake autoconf

      - name: Build vrecord .pkg and .dmg (Release_Mac.sh)
        env:
          MACOS_CODESIGN_IDENTITY: ""
        run: |
          chmod +x Release/Release_Mac.sh
          ./Release/Release_Mac.sh || echo "::warning::Release_Mac.sh incomplete - collecting partial output"
        continue-on-error: true

      - name: Build vrecord .app bundle
        run: |
          chmod +x Release/build-mac-app.sh
          ./Release/build-mac-app.sh

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          find Release -maxdepth 1 -name 'vrecord_*_Mac*.dmg' -exec cp {} artifacts/ \; || true
          find Release -maxdepth 1 -name 'vrecord.pkg' -exec cp {} "artifacts/vrecord_${ARCH}.pkg" \; || true
          cp -a Release/artifacts/vrecord.app artifacts/ 2>/dev/null || true
          cp -a Release/artifacts/*.app.zip artifacts/ 2>/dev/null || true
          ls -la artifacts/

      - uses: actions/upload-artifact@v7
        with:
          name: vrecord-macos-${{ matrix.arch }}
          path: artifacts/
          if-no-files-found: error

  # releases are published by build-and-release.yml from these artifacts
